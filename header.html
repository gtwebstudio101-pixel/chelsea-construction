<nav id="navbar">
  <a href="#" class="nav-logo">
    <img src="https://github.com/gtwebstudio101-pixel/chelsea-construction/blob/dc0093e917a831aecf92b22494f2b9e18640b1dd/img/primary-blue-grey-main-224x300.png.webp?raw=true" alt="Chelsea Construction Company">
  </a>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#approach">Approach</a></li>
    <li><a href="#testimonials">Testimonials</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <a href="#contact" class="nav-cta">Enquire Now</a>
  <div class="hamburger" id="ham" onclick="toggleMobileMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>
<div class="mob-menu" id="mobMenu">
  <a href="#home" onclick="closeMob()">Home</a>
  <a href="#about" onclick="closeMob()">About</a>
  <a href="#approach" onclick="closeMob()">Approach</a>
  <a href="#testimonials" onclick="closeMob()">Testimonials</a>
  <a href="#projects" onclick="closeMob()">Projects</a>
  <a href="#contact" onclick="closeMob()">Contact</a>
  <a href="#contact" onclick="closeMob()" style="color: #d4b98a;">Enquire Now</a>
</div>

<script>
  // Mobile menu toggle
  function toggleMobileMenu() {
    const ham = document.getElementById('ham');
    const mobMenu = document.getElementById('mobMenu');
    if (ham && mobMenu) {
      ham.classList.toggle('open');
      mobMenu.classList.toggle('open');
    }
  }

  function closeMob() {
    const ham = document.getElementById('ham');
    const mobMenu = document.getElementById('mobMenu');
    if (ham && mobMenu) {
      ham.classList.remove('open');
      mobMenu.classList.remove('open');
    }
  }

  // Navbar scroll effect
  const navbar = document.getElementById('navbar');
  if (navbar) {
    window.addEventListener('scroll', function() {
      if (window.scrollY > 60) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  }

  // Smooth scroll for all anchor links
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          const headerHeight = navbar ? navbar.offsetHeight : 80;
          const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
          
          window.scrollTo({
            top: targetPosition,
            behavior: 'smooth'
          });
        }
      });
    });
  });
</script>
